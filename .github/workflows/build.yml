name: Build compression-pool

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  release:
    types: [ prereleased, released ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build all targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cargo-xwin

      - name: Build Linux x64
        run: cargo build --release -j "$(nproc)" --target x86_64-unknown-linux-gnu

      - name: Build Linux arm64
        run: cross build --release -j "$(nproc)" --target aarch64-unknown-linux-gnu

      - name: Build Windows x64
        run: cargo xwin build --release --target x86_64-pc-windows-msvc

      - name: Build Windows arm64
        run: cargo xwin build --release --target aarch64-pc-windows-msvc

      - name: Stage binaries
        run: |
          mkdir -p dist
          mv target/x86_64-unknown-linux-gnu/release/compression-pool dist/compression-pool-linux-x64
          mv target/aarch64-unknown-linux-gnu/release/compression-pool dist/compression-pool-linux-arm64
          mv target/x86_64-pc-windows-msvc/release/compression-pool.exe dist/compression-pool-windows-x64.exe
          mv target/aarch64-pc-windows-msvc/release/compression-pool.exe dist/compression-pool-windows-arm64.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist

  release:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded files
        run: ls -R ./artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
