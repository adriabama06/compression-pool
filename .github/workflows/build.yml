name: Build compression-pool

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  release:
    types: [ prereleased, released ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build
        run: cargo build --release -j "$(nproc)"

      - name: Rename file
        run: |
          mv target/release/compression-pool compression-pool-linux-x64

      - name: Upload Linux x64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: compression-pool-linux-x64

  build-linux-arm64:
    name: Build Linux arm64
    needs: build-linux-x64
    runs-on: ubuntu-latest-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Running on:"
          uname -a

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies (arm64)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build
        run: cargo build --release -j "$(nproc)"

      - name: Rename file
        run: |
          mv target/release/compression-pool compression-pool-linux-arm64

      - name: Upload Linux arm64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: compression-pool-linux-arm64

  build-windows-x64:
    name: Build Windows x64
    needs: build-linux-arm64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: cargo build --release -j $env:NUMBER_OF_PROCESSORS

      - name: Rename file
        shell: pwsh
        run: Move-Item -Force target/release/compression-pool.exe compression-pool-windows-x64.exe

      - name: Upload Windows x64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: compression-pool-windows-x64.exe

  build-windows-arm64:
    name: Build Windows arm64
    needs: build-windows-x64
    runs-on: windows-latest-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment (Windows)
        run: |
          systeminfo
        shell: pwsh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: cargo build --release -j $env:NUMBER_OF_PROCESSORS

      - name: Rename file
        shell: pwsh
        run: Move-Item -Force target/release/compression-pool.exe compression-pool-windows-arm64.exe

      - name: Upload Windows arm64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: compression-pool-windows-arm64.exe

  release:
    name: Attach binaries to release
    needs: build-windows-arm64
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded files
        run: ls -R ./artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
