name: Build compression-pool

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  release:
    types: [ prereleased, released ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            target: x86_64-unknown-linux-gnu
            method: native
            bin: compression-pool
            out: compression-pool-linux-x64
            artifact: linux-x64
          - name: Linux arm64
            target: aarch64-unknown-linux-gnu
            method: cross
            bin: compression-pool
            out: compression-pool-linux-arm64
            artifact: linux-arm64
          - name: Windows x64
            target: x86_64-pc-windows-msvc
            method: xwin
            bin: compression-pool.exe
            out: compression-pool-windows-x64.exe
            artifact: windows-x64
          - name: Windows arm64
            target: aarch64-pc-windows-msvc
            method: xwin
            bin: compression-pool.exe
            out: compression-pool-windows-arm64.exe
            artifact: windows-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.method == 'cross'
        uses: taiki-e/install-action@cross

      - name: Install cargo-xwin
        if: matrix.method == 'xwin'
        uses: taiki-e/install-action@cargo-xwin

      - name: Build (native)
        if: matrix.method == 'native'
        run: cargo build --release --target "${{ matrix.target }}" -j "$(nproc)"

      - name: Build (cross)
        if: matrix.method == 'cross'
        run: cross build --release --target "${{ matrix.target }}" -j "$(nproc)"

      - name: Build (xwin)
        if: matrix.method == 'xwin'
        run: cargo xwin build --release --target "${{ matrix.target }}"

      - name: Rename file
        run: |
          mv "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.out }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}

  release:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded files
        run: ls -R ./artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
