name: e2e

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg (full build via ffmpeg-vm)
        # NOTE: apt's ffmpeg lacks libvmaf, so use a full static build
        # managed by ffmpeg-version-manager (installs into ~/ffmpeg-vm/bin
        # and appends it to ~/.bashrc, which CI steps don't source).
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/ffmpeg-version-manager https://github.com/adriabama06/ffmpeg-version-manager/releases/download/v0.1.9/ffmpeg-version-manager
          chmod +x /tmp/ffmpeg-version-manager
          /tmp/ffmpeg-version-manager -i latest
          echo "$HOME/ffmpeg-vm/bin" >> "$GITHUB_PATH"
          for b in "$HOME"/ffmpeg-vm/bin/*; do
            sudo ln -sf "$b" /usr/local/bin/"$(basename "$b")"
          done
          export PATH="$HOME/ffmpeg-vm/bin:$PATH"
          hash -r
          which -a ffmpeg
          ffmpeg -version
          ffmpeg -hide_banner -filters 2>/dev/null | grep -i vmaf

      - name: Install ab-av1
        run: cargo install ab-av1 --locked

      - name: Run end-to-end test
        run: bash run_end_to_end_test.sh

      - name: Print e2e logs
        if: always()
        run: |
          echo '===== tmp/head.log ====='
          cat tmp/head.log || echo '(missing tmp/head.log)'
          echo '===== tmp/worker/worker.log ====='
          cat tmp/worker/worker.log || echo '(missing tmp/worker/worker.log)'

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            tmp/head.log
            tmp/worker/worker.log
